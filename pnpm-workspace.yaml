packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  postcss: '^8.5.3'
  glob: '^10.5.0'
  deepmerge-ts: '^8.0.0'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'esbuild'
  - 'prisma'
  - 'unrs-resolver'
