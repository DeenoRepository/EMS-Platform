name: EMS Platform CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Security, Quality, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: Setup Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ems/database generate

      - name: Audit Production Dependencies
        run: pnpm audit --audit-level=high

      - name: Run TypeScript Typecheck
        run: pnpm --filter @ems/web exec tsc --noEmit

      - name: Verify Theme Tokens
        run: pnpm check:theme

      - name: Verify Documentation Links
        run: pnpm check:docs

      - name: Verify Script Syntax
        run: |
          for file in scripts/*.js scripts/*.mjs scripts/lib/*.js; do node --check "$file"; done
          for file in scripts/*.py; do python3 -m py_compile "$file"; done

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Code Quality Gate
        run: pnpm check:quality

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            quality-web.json
            quality-packages.json

      - name: Verify plans/README.md is up to date
        run: node scripts/plans-index.mjs --check

      - name: Verify docs/quality/QUALITY_BASELINE.md is up to date
        run: |
          node scripts/check-quality-baseline.mjs --report
          git diff --exit-code -- docs/quality/QUALITY_BASELINE.md

      - name: Verify docs/quality/SECURITY_BASELINE.md is up to date
        run: |
          python3 scripts/route_audit.py --report
          git diff --exit-code -- docs/quality/SECURITY_BASELINE.md

      - name: Run Automated Test Suite (Domain, SecOps, RBAC)
        run: pnpm test

      - name: Run React Component Tests (vitest + RTL)
        run: pnpm --filter @ems/web test:components

      - name: Run Coverage Gate and Verify Baseline
        run: |
          node scripts/check-coverage.mjs --report
          git diff --exit-code -- docs/quality/COVERAGE_BASELINE.md

      - name: Build Monorepo (Turborepo & Next.js Production Build)
        run: pnpm build
        env:
          NODE_ENV: production
          JWT_SECRET: super_secret_ci_dummy_jwt_key_minimum_32_characters_long

  e2e:
    name: E2E Smoke Tests (Playwright + PostgreSQL)
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: Setup Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ems/database generate

      - name: Build Monorepo (required by Next.js production server for E2E)
        run: pnpm build
        env:
          NODE_ENV: production
          JWT_SECRET: super_secret_ci_dummy_jwt_key_minimum_32_characters_long

      - name: Install Playwright Browsers (Chromium only)
        run: pnpm --filter @ems/web exec playwright install --with-deps chromium

      - name: Run E2E Smoke Tests
        run: pnpm --filter @ems/web test:e2e
        env:
          E2E_DB_HOST: localhost
          E2E_DB_PORT: 5432
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: postgres
          E2E_PORT: 3100
          JWT_SECRET: super_secret_ci_dummy_jwt_key_minimum_32_characters_long

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
