name: EMS Platform CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ems/database generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Automated Test Suite (Domain, SecOps, RBAC)
        run: pnpm test

      - name: Build Monorepo (Turborepo & Next.js 14 Production Build)
        run: pnpm build
        env:
          NODE_ENV: production
          JWT_SECRET: super_secret_ci_dummy_jwt_key_minimum_32_characters_long
