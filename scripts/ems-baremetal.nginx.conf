# ==============================================================================
# EMS Platform — Native Baremetal Nginx Configuration (/etc/nginx/sites-available/ems)
# ==============================================================================

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=ems_baremetal_limit:10m rate=30r/s;

upstream ems_baremetal_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum file upload size (CAD drawings, technical sheets, photos)
    client_max_body_size 64M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js Static Assets Caching
    location /_next/static/ {
        alias /opt/ems-platform/apps/web/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Uploaded Files Routing
    location /uploads/ {
        alias /opt/ems-platform/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # API routes with rate limiting
    location /api/ {
        limit_req zone=ems_baremetal_limit burst=50 nodelay;

        proxy_pass http://ems_baremetal_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Main application routing
    location / {
        proxy_pass http://ems_baremetal_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Healthcheck endpoint
    location /healthz {
        proxy_pass http://ems_baremetal_backend/api/system/health;
        access_log off;
    }
}
