version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL database for Atlassian Jira Software
  # ----------------------------------------------------------------------------
  jira-postgres:
    image: postgres:14-alpine
    container_name: ems_jira_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${JIRA_DB_USER:-jira}
      POSTGRES_PASSWORD: ${JIRA_DB_PASSWORD:?JIRA_DB_PASSWORD is required}
      POSTGRES_DB: ${JIRA_DB_NAME:-jiradb}
    volumes:
      - jira_postgres_data:/var/lib/postgresql/data
    networks:
      - ems_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira -d jiradb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Official Atlassian Jira Software Server / Data Center (9.10.0)
  # ----------------------------------------------------------------------------
  jira-software:
    image: atlassian/jira-software:9.10.0
    container_name: ems_jira_enterprise
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ATL_JDBC_URL: jdbc:postgresql://jira-postgres:5432/${JIRA_DB_NAME:-jiradb}
      ATL_JDBC_USER: ${JIRA_DB_USER:-jira}
      ATL_JDBC_PASSWORD: ${JIRA_DB_PASSWORD:?JIRA_DB_PASSWORD is required}
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      JVM_MINIMUM_MEMORY: 1024m
      JVM_MAXIMUM_MEMORY: 2048m
    volumes:
      - jira_home_data:/var/atlassian/application-data/jira
    depends_on:
      jira-postgres:
        condition: service_healthy
    networks:
      - ems_network

volumes:
  jira_postgres_data:
    driver: local
  jira_home_data:
    driver: local

networks:
  ems_network:
    external: true
